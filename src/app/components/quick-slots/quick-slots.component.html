<div class="qs-container px-panel">
  <div class="qs-grid">
    @for (slot of displaySlots(); track slot.action) {
      <div
        class="qs-slot px-panel--inset"
        [class.qs-slot--empty]="slot.isEmpty"
        [class.qs-slot--depleted]="!slot.isEmpty && slot.count === 0"
        [class.qs-slot--buff]="slot.isBuff"
        [title]="slot.isEmpty ? 'Drag a skill or potion here' : slot.label"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event, slot.action)"
        (contextmenu)="onClearSlot($event, slot.action)"
        [attr.data-testid]="'quickslot-slot-' + slot.action"
      >
        <span class="qs-key">{{ slot.keyLabel }}</span>
        @if (!slot.isEmpty) {
          <app-pixel-icon class="qs-icon" [icon]="slot.icon" [size]="24" />
          @if (slot.count !== null) {
            <span class="qs-count">{{ slot.count }}</span>
          }
        }
      </div>
    }
  </div>
  <div class="qs-stock">
    @for (stock of potionStock(); track stock.category) {
      <div
        class="qs-stock-cell px-panel--inset"
        [class.qs-stock-cell--low]="stock.isLow"
        [title]="stock.isLow ? stock.label + ' running low' : stock.label"
        [attr.data-testid]="'quickslot-stock-' + stock.category"
      >
        <app-pixel-icon [icon]="stock.icon" [size]="24" />
        <span class="qs-stock-count" [attr.data-testid]="'quickslot-stock-count-' + stock.category">{{ stock.count }}</span>
        @if (stock.isLow) {
          <span class="qs-stock-low" [attr.data-testid]="'quickslot-stock-low-' + stock.category">Low</span>
        }
      </div>
    }
  </div>
</div>
